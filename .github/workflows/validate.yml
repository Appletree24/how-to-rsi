name: Validate TypeScript site and evaluation lab
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Verify generated content and local links
        run: python3 scripts/check_content.py
      - name: Typecheck and build production site
        run: npm run build
      - name: Install browser for production smoke checks
        run: npx playwright install --with-deps chromium
      - name: Exercise production routes and interactions
        run: npm run test:browser
      - name: Exercise evaluation contracts and decisions
        run: python3 -m unittest discover -s tests -v
      - name: Run reproducible synthetic examples
        run: python3 labs/eval_lab.py demo --output "$RUNNER_TEMP/rsi-eval-lab"
      - name: Run finite improver self-application and negative results
        run: python3 labs/improver_lab.py --rounds 2 --output "$RUNNER_TEMP/improver-lab/report.json"
      - name: Run RepoOps tool loop and durable reports
        run: python3 -m projects.repoops.runner demo --output "$RUNNER_TEMP/repoops-lab"
