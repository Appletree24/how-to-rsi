name: Validate content and evaluation lab
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify generated content and local links
        run: python3 scripts/check_content.py
      - name: Check browser script syntax
        run: |
          node --check assets/js/data.js
          node --check assets/js/research-data.js
          node --check assets/js/app.js
          node --check assets/js/research.js
      - name: Exercise evaluation contracts and decisions
        run: python3 -m unittest discover -s tests -v
      - name: Run reproducible synthetic examples
        run: python3 labs/eval_lab.py demo --output "$RUNNER_TEMP/rsi-eval-lab"
      - name: Run finite improver self-application and negative results
        run: python3 labs/improver_lab.py --rounds 2 --output "$RUNNER_TEMP/improver-lab/report.json"
      - name: Run RepoOps tool loop and durable reports
        run: python3 -m projects.repoops.runner demo --output "$RUNNER_TEMP/repoops-lab"
