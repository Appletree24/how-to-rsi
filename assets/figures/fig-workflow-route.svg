<svg xmlns="http://www.w3.org/2000/svg" width="840" height="480" viewBox="0 0 840 480" role="img" aria-labelledby="title desc">
  <title id="title">开发工作流：文档定位与分场景验证</title>
  <desc id="desc">左侧按改动对象映射到对应文档；右侧是五组常用命令，按环境、运行、测试、质量、文档排序；底部是事故复盘与配方类文档的回流位置。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#2b5bd7" stroke-width="1.5" /></marker>
  </defs>
  <rect width="840" height="480" fill="#faf9f6" />
  <g font-family="Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#22252a">
    <text x="30" y="35" font-size="16" fill="#5e625f">文档定位改动归属，命令验证对应场景；postmortem/ 记录故障原因与防线</text>

    <rect x="30" y="58" width="390" height="330" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5" />
    <text x="48" y="84" font-size="15" fill="#40587f">文档路由：改动对象 → 对应文档</text>

    <rect x="48" y="102" width="150" height="46" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="62" y="131" font-size="15">改 packages/ 前</text>
    <path d="M198 125H232" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="234" y="102" width="170" height="46" rx="3" fill="#fff" stroke="#2b5bd7" stroke-width="1.5" />
    <text x="246" y="122" font-size="13" font-weight="700">architecture.md</text>
    <text x="246" y="140" font-size="12">分层 · seam · 挂哪查询表</text>

    <rect x="48" y="160" width="150" height="46" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="62" y="189" font-size="15">动某个子系统</text>
    <path d="M198 183H232" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="234" y="160" width="170" height="46" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="246" y="180" font-size="13" font-weight="700">subsystems/&lt;name&gt;.md</text>
    <text x="246" y="198" font-size="12">含生成的 Cordis API</text>

    <rect x="48" y="218" width="150" height="46" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="62" y="247" font-size="15">术语不确定</text>
    <path d="M198 241H232" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="234" y="218" width="170" height="46" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="246" y="238" font-size="13" font-weight="700">glossary.md</text>
    <text x="246" y="256" font-size="12">唯一正式定义源</text>

    <rect x="48" y="276" width="150" height="46" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="62" y="305" font-size="15">查找实现范例</text>
    <path d="M198 299H232" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="234" y="276" width="170" height="46" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="246" y="296" font-size="13" font-weight="700">cookbook/</text>
    <text x="246" y="314" font-size="12">按场景配方 + 签收流程</text>

    <rect x="48" y="334" width="150" height="46" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="62" y="363" font-size="15">分析故障原因</text>
    <path d="M198 357H232" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="234" y="334" width="170" height="46" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="246" y="354" font-size="13" font-weight="700">postmortem/</text>
    <text x="246" y="372" font-size="12">什么坏了/为何漏测/防线</text>

    <rect x="450" y="58" width="360" height="330" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5" />
    <text x="468" y="84" font-size="15" fill="#40587f">命令按场景分五组</text>

    <rect x="468" y="100" width="324" height="48" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="482" y="120" font-size="14" font-weight="700">环境 · install / typecheck</text>
    <text x="482" y="139" font-size="12" fill="#5e625f">Node ^22.19 || ≥24，clone 后先 typecheck 验证</text>

    <rect x="468" y="156" width="324" height="48" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="482" y="176" font-size="14" font-weight="700">运行 · dsh --profile / web</text>
    <text x="482" y="195" font-size="12" fill="#5e625f">从源码起任务；--dump-config 看插件树</text>

    <rect x="468" y="212" width="324" height="48" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="482" y="232" font-size="14" font-weight="700">测试 · test / e2e</text>
    <text x="482" y="251" font-size="12" fill="#5e625f">coverage 门禁 src 逐文件 100%；无密钥自动跳过</text>

    <rect x="468" y="268" width="324" height="48" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="482" y="288" font-size="14" font-weight="700">质量 · lint / duplication / hygiene</text>
    <text x="482" y="307" font-size="12" fill="#5e625f">风格、TS 克隆检测、publint + NodeNext 检查</text>

    <rect x="468" y="324" width="324" height="48" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="482" y="344" font-size="14" font-weight="700">文档 · doc-sync / test:docs / website:build</text>
    <text x="482" y="363" font-size="12" fill="#5e625f">文档门禁；VitePress 构建兼作死链检查</text>

    <path d="M630 388V420H420V436" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <text x="440" y="414" font-size="14" fill="#5e625f">验证不过 → 回查文档/复盘</text>

    <text x="30" y="456" font-size="15" fill="#5e625f">流程示意：验证失败后回查事故复盘中的既有防线；新增结构约束可由 verify 门禁持续检查。</text>
  </g>
</svg>