<svg xmlns="http://www.w3.org/2000/svg" width="840" height="430" viewBox="0 0 840 430" role="img" aria-labelledby="title desc">
  <title id="title">场景自测：解析、复查与项目面试</title>
  <desc id="desc">16 题逐题推进：作答即锁定并显示判定与解析，进度点记录对错；结束后显示本轮得分与正确率。根据错题主题回到对应章节，核对执行轨迹并验证反例，再进入项目面试；也可清零重测。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#2b5bd7" stroke-width="1.5"/></marker>
  </defs>
  <rect width="840" height="430" fill="#faf9f6"/>
  <g font-family="Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#22252a">
    <text x="30" y="35" font-size="16" fill="#5e625f">16 题检查场景判断：逐题解析 → 按错题主题复查与验证反例 → 项目面试</text>

    <rect x="30" y="58" width="780" height="150" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5"/>
    <text x="48" y="82" font-size="15" fill="#40587f">逐题循环 · 作答后显示解析</text>
    <rect x="56" y="98" width="150" height="64" rx="3" fill="#fff" stroke="#2b5bd7" stroke-width="1.5"/>
    <text x="72" y="127" font-size="16" font-weight="700">出题 Q n/16</text>
    <text x="72" y="149" font-size="14">顺序推进，四选项</text>
    <rect x="252" y="98" width="150" height="64" rx="3" fill="#fff" stroke="#bfc3c9"/>
    <text x="268" y="127" font-size="16" font-weight="700">点选作答</text>
    <text x="268" y="149" font-size="14">点击即锁定本题</text>
    <rect x="448" y="98" width="160" height="64" rx="3" fill="#fff" stroke="#bfc3c9"/>
    <text x="464" y="127" font-size="16" font-weight="700">判定 + 解析</text>
    <text x="464" y="149" font-size="14">标对/标错 + 原因 e</text>
    <rect x="654" y="98" width="140" height="64" rx="3" fill="#fff" stroke="#bfc3c9"/>
    <text x="670" y="127" font-size="16" font-weight="700">进度点记录</text>
    <text x="670" y="149" font-size="14">对 · 错 · 当前</text>
    <path d="M206 130H250" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M402 130H446" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M608 130H652" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M724 162V190H131V164" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="420" y="184" text-anchor="middle" font-size="14" fill="#40587f">未满 16 题 → 下一题；答错已记入进度点，不回改</text>

    <path d="M724 208V236H560" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="380" y="238" width="178" height="82" rx="3" fill="#fff" stroke="#2b5bd7" stroke-width="1.5"/>
    <text x="396" y="267" font-size="16" font-weight="700">结算 score/16</text>
    <text x="396" y="291" font-size="14">场景判断正确率</text>
    <text x="396" y="311" font-size="14">不代表项目能力</text>
    <rect x="56" y="238" width="270" height="82" rx="3" fill="#fff" stroke="#bfc3c9"/>
    <text x="72" y="267" font-size="16" font-weight="700">按错题主题复查</text>
    <text x="72" y="291" font-size="14">回到对应章节或术语表</text>
    <text x="72" y="311" font-size="14">核对执行轨迹，验证反例</text>
    <path d="M380 279H328" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="56" y="352" width="270" height="56" rx="3" fill="#fff" stroke="#bfc3c9"/>
    <text x="72" y="375" font-size="14">进入项目面试：讨论决策与反例</text>
    <text x="72" y="397" font-size="14">虚线回环：再来一次，进度清零</text>
    <path d="M191 320V350" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M56 380H40V130H54" fill="none" stroke="#2b5bd7" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  </g>
</svg>
