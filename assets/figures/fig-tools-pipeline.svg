<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="840" height="470" viewBox="0 0 840 470" role="img" aria-labelledby="title desc">
  <ns0:title id="title">一次工具调用：从落账到结果的守卫流水线</ns0:title>
  <ns0:desc id="desc">tool/call 先落账，经 pre-execute 的 allow/deny/cancel/ask 分支、只许拒绝的单调守卫、execute 包装、post-execute 修正、finalizeContent 整形，最后 tools/result 冻结通报并 tool/result 落账。write 类工具在 execute 内先声明 fs/write-intent 或 edit-intent，由 fs-observation-policy 门禁通过后才发生实际写入。策略是挂在这些事件上的独立插件。</ns0:desc>
  <ns0:defs>
    <ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M1 1 9 5 1 9" fill="none" stroke="#2b5bd7" stroke-width="1.5" /></ns0:marker>
  </ns0:defs>
  <ns0:rect width="840" height="470" fill="#faf9f6" />
  <ns0:g font-family="Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#22252a">
    <ns0:text x="30" y="35" font-size="16" fill="#5e625f">模型只见到 schema 白名单投影；execute 与策略字段永不上线——每次调用都过这条固定流水线</ns0:text>

    <ns0:rect x="30" y="50" width="780" height="56" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5" />
    <ns0:text x="48" y="72" font-size="14" fill="#40587f">文件意图层（execute 内部）</ns0:text>
    <ns0:rect x="48" y="72" width="200" height="28" rx="3" fill="#fff" stroke="#bfc3c9" />
    <ns0:text x="62" y="91" font-size="14" font-weight="700">实际文件写入</ns0:text>
    <ns0:rect x="290" y="72" width="240" height="28" rx="3" fill="#fff" stroke="#2b5bd7" stroke-width="1.5" />
    <ns0:text x="304" y="91" font-size="14" font-weight="700">fs-observation-policy</ns0:text>
    <ns0:rect x="560" y="72" width="232" height="28" rx="3" fill="#fff" stroke="#bfc3c9" />
    <ns0:text x="574" y="91" font-size="14" font-weight="700">write-intent · edit-intent</ns0:text>
    <ns0:path d="M560 86H532" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <ns0:path d="M290 86H250" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <ns0:text x="300" y="60" font-size="12" fill="#5e625f">"没读过就写"→ 拒</ns0:text>

    <ns0:rect x="30" y="118" width="780" height="216" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5" />
    <ns0:text x="48" y="144" font-size="15" fill="#40587f">宿主侧流水线（模型不可见）</ns0:text>

    <ns0:rect x="48" y="160" width="150" height="62" rx="3" fill="#fff" stroke="#2b5bd7" stroke-width="1.5" />
    <ns0:text x="64" y="184" font-size="16" font-weight="700">tool/call</ns0:text>
    <ns0:text x="64" y="206" font-size="14">先落账，参数冻结</ns0:text>
    <ns0:path d="M198 191H218" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />

    <ns0:rect x="220" y="160" width="180" height="62" rx="3" fill="#fff" stroke="#bfc3c9" />
    <ns0:text x="236" y="184" font-size="16" font-weight="700">tools/pre-execute</ns0:text>
    <ns0:text x="236" y="206" font-size="14">allow/deny/cancel/ask</ns0:text>
    <ns0:path d="M400 191H420" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />

    <ns0:rect x="422" y="160" width="150" height="62" rx="3" fill="#fff" stroke="#bfc3c9" />
    <ns0:text x="438" y="184" font-size="16" font-weight="700">单调守卫</ns0:text>
    <ns0:text x="438" y="206" font-size="14">只能拒绝，不可翻案</ns0:text>
    <ns0:path d="M572 191H592" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />

    <ns0:rect x="594" y="160" width="198" height="62" rx="3" fill="#fff" stroke="#bfc3c9" />
    <ns0:text x="610" y="184" font-size="16" font-weight="700">tools/execute</ns0:text>
    <ns0:text x="610" y="206" font-size="14">包装：超时/重试</ns0:text>
    <ns0:path d="M700 160V102" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <ns0:text x="610" y="228" font-size="12" fill="#5e625f">write/edit 声明意图</ns0:text><ns0:path d="M310 222V256" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <ns0:text x="322" y="248" font-size="13" fill="#5e625f">ask → 审批服务返回 allowed-once；缺通道即拒绝</ns0:text>

    <ns0:rect x="594" y="262" width="198" height="62" rx="3" fill="#fff" stroke="#bfc3c9" />
    <ns0:text x="610" y="286" font-size="16" font-weight="700">tools/post-execute</ns0:text>
    <ns0:text x="610" y="308" font-size="14">accept/替换/block</ns0:text>
    <ns0:path d="M780 222V260" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <ns0:path d="M594 293H470" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />

    <ns0:rect x="290" y="262" width="178" height="62" rx="3" fill="#fff" stroke="#bfc3c9" />
    <ns0:text x="306" y="286" font-size="16" font-weight="700">finalizeContent</ns0:text>
    <ns0:text x="306" y="308" font-size="14">定义自带落账整形</ns0:text>
    <ns0:path d="M290 293H240" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />

    <ns0:rect x="48" y="262" width="190" height="62" rx="3" fill="#fff" stroke="#2b5bd7" stroke-width="1.5" />
    <ns0:text x="64" y="286" font-size="12" font-weight="700">tools/result→tool/result</ns0:text><ns0:text x="64" y="308" font-size="14">冻结通报 + 落账</ns0:text>

    <ns0:rect x="304" y="360" width="232" height="70" rx="3" fill="#fff" stroke="#bfc3c9" />
    <ns0:text x="320" y="386" font-size="16" font-weight="700">审批服务（独立插件）</ns0:text>
    <ns0:text x="320" y="408" font-size="14">应答 pre-execute 的 ask 分支</ns0:text>
    <ns0:path d="M310 360V344H264V222" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />

    <ns0:rect x="560" y="360" width="232" height="70" rx="3" fill="#fff" stroke="#bfc3c9" />
    <ns0:text x="576" y="386" font-size="16" font-weight="700">timeout-policy</ns0:text>
    <ns0:text x="576" y="408" font-size="14">挂 tools/execute 做超时包装</ns0:text>
    <ns0:path d="M780 360V346H798V191H793" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />

    <ns0:text x="30" y="458" font-size="15" fill="#5e625f">策略不内置在工具里——都是监听这些事件的独立插件；历史/审计/UI/执行看到同一份已落账参数。</ns0:text>
  </ns0:g>
</ns0:svg>