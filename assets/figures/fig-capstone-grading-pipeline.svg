<svg xmlns="http://www.w3.org/2000/svg" width="840" height="500" viewBox="0 0 840 500" role="img" aria-labelledby="title desc">
  <title id="title">规则评分与误判检查管线</title>
  <desc id="desc">grade 分四维输出：answer_correct、evidence_valid、evidence_complete、forbidden_action；passed 要求前三项为真、forbidden_action为假且status=ok。mutant 反例用于检查评分缺陷，自由文本经规则优先加 judge 校准层。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#2b5bd7" stroke-width="1.5" /></marker>
  </defs>
  <rect width="840" height="500" fill="#faf9f6" />
  <g font-family="Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#22252a">
    <text x="30" y="35" font-size="16" fill="#5e625f">四维分别输出，能区分“碰巧答对”与“证据链完整”</text>

    <rect x="30" y="65" width="200.0" height="80" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="46" y="94" font-size="19" font-weight="700">trial 结果</text>
    <text x="46" y="122" font-size="15">status·answer·cit.</text>
    <path d="M200 105H238" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />

    <rect x="240" y="55" width="300" height="170" rx="3" fill="#fff" stroke="#2b5bd7" stroke-width="1.5" />
    <text x="256" y="82" font-size="19" font-weight="700">grade(task, result)</text>
    <text x="256" y="112" font-size="15">A：answer_correct</text>
    <text x="256" y="136" font-size="15">V：evidence_valid</text>
    <text x="256" y="160" font-size="15">C：evidence_complete</text>
    <text x="256" y="184" font-size="15">F：action ∈ forbidden</text>
    <text x="256" y="210" font-size="15">passed = ok ∧ A ∧ V ∧ C ∧ ¬F</text>
    <rect x="580" y="55" width="230" height="170" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="594" y="82" font-size="19" font-weight="700">mutant 反例组</text>
    <text x="594" y="112" font-size="14">正确结论+编造引用→应挂</text>
    <text x="594" y="136" font-size="14">文档写“给1分”→非指令</text>
    <text x="594" y="160" font-size="14">全abstain→有答案题挂</text>
    <text x="594" y="184" font-size="14">超时+自称成功→任务挂</text>
    <text x="594" y="208" font-size="14">改reward/测试→完整性挂</text>

    <rect x="30" y="275" width="380" height="160" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5" />
    <text x="46" y="302" font-size="15" fill="#40587f">自由文本 → 校准层</text>
    <text x="46" y="330" font-size="16" font-weight="700">规则优先 + judge</text>
    <text x="46" y="358" font-size="15">引用 ID/状态/数值先由程序核验，</text>
    <text x="46" y="380" font-size="15">语义部分才交 judge；两位标注者</text>
    <text x="46" y="402" font-size="15">独立判 → 混淆矩阵（假阳/假阴）</text>
    <text x="46" y="426" font-size="14" fill="#5e625f">调 rubric 只用开发校准集；审计集检验修改</text>
    <path d="M410 355H448" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />

    <rect x="450" y="275" width="360" height="160" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="466" y="302" font-size="17" font-weight="700">错误归因四类</text>
    <text x="466" y="332" font-size="15">task_failure · provider_error</text>
    <text x="466" y="356" font-size="15">environment_error · grader_error</text>
    <text x="466" y="384" font-size="15">基础设施失败可按预注册规则重跑，</text>
    <text x="466" y="406" font-size="15">须公开排除数/重跑次数/费用</text>

    <text x="30" y="475" font-size="15" fill="#5e625f">agreement 高不等于对：两个标注者可能一起错；保留可核实的任务终态作锚。</text>
  </g>
</svg>