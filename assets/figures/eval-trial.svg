<svg xmlns="http://www.w3.org/2000/svg" width="840" height="490" viewBox="0 0 840 490" role="img" aria-labelledby="title desc">
  <title id="title">一次评测：执行与独立判分</title>
  <desc id="desc">任务与干净快照进入候选环境，运行分别产生终态和轨迹。外部评分器读取证据并保存单次结果；候选没有评分器与成绩库的写权限。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#2b5bd7" stroke-width="1.5"/></marker>
  </defs>
  <rect width="840" height="490" fill="#faf9f6"/>
  <g font-family="Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#22252a">
    <text x="30" y="35" font-size="16" fill="#5e625f">一条任务，从干净环境开始，留下独立判定的结果</text>
    <rect x="270" y="68" width="274" height="224" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5"/>
    <text x="288" y="93" font-size="16" fill="#40587f">候选可写入的范围</text>
    <rect x="30" y="120" width="194" height="104" rx="3" fill="#fff" stroke="#bfc3c9"/>
    <text x="46" y="149" font-size="19" font-weight="700">任务 + 环境快照</text>
    <text x="46" y="177" font-size="17">初始文件与业务状态</text>
    <text x="46" y="200" font-size="17">固定运行配置与预算</text>
    <rect x="288" y="120" width="238" height="104" rx="3" fill="#fff" stroke="#2b5bd7"/>
    <text x="304" y="149" font-size="19" font-weight="700">Agent 执行环境</text>
    <text x="304" y="177" font-size="17">模型 + 提示词 + 工具</text>
    <text x="304" y="200" font-size="17">隔离运行，限制副作用</text>
    <text x="288" y="257" font-size="17" fill="#40587f">每次 trial 前重置状态</text>
    <path d="M224 172H286" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M526 156H560V140H582" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M560 156V252H582" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="584" y="102" width="226" height="82" rx="3" fill="#fff" stroke="#bfc3c9"/>
    <text x="600" y="131" font-size="19" font-weight="700">产物与环境终态</text>
    <text x="600" y="159" font-size="17">究竟改变了什么？</text>
    <rect x="584" y="214" width="226" height="82" rx="3" fill="#fff" stroke="#bfc3c9"/>
    <text x="600" y="243" font-size="19" font-weight="700">执行轨迹</text>
    <text x="600" y="271" font-size="17">执行端记录的事件</text>
    <path d="M792 184H824V312H778V326" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M698 296V326" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="584" y="330" width="226" height="102" rx="3" fill="#fff" stroke="#2b5bd7" stroke-width="1.5"/>
    <text x="600" y="359" font-size="19" font-weight="700">外部评分器</text>
    <text x="600" y="387" font-size="17">核对终态与任务要求</text>
    <text x="600" y="410" font-size="17">检查过程中的必要约束</text>
    <rect x="288" y="330" width="238" height="102" rx="3" fill="#fff" stroke="#bfc3c9"/>
    <text x="304" y="359" font-size="19" font-weight="700">单次运行结果</text>
    <text x="304" y="387" font-size="17">通过 / 失败 + 违规项</text>
    <text x="304" y="410" font-size="17">成本、延迟与证据位置</text>
    <path d="M584 381H528" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M44 350v-9a10 10 0 0 1 20 0v9m-24 0h28v24H40z" fill="none" stroke="#5e625f" stroke-width="1.6"/>
    <text x="30" y="398" font-size="17" font-weight="700">候选无权写入</text>
    <text x="30" y="422" font-size="16" fill="#5e625f">评分器与成绩库</text>
    <text x="30" y="467" font-size="16" fill="#5e625f">轨迹用于解释过程；声称“已完成”不等于环境终态正确。</text>
  </g>
</svg>
