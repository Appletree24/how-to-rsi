<svg xmlns="http://www.w3.org/2000/svg" width="840" height="430" viewBox="0 0 840 430" role="img" aria-labelledby="title desc">
  <title id="title">Profile × Bundle × Patch：四层按序引导</title>
  <desc id="desc">四层按序应用到空条目列表：profile 声明的 bundles（dsh-base 在最下）、profile 自己的 cordis.patch.yml、Harness home 的全局补丁、--patch 覆盖层，最后组合出可 dump 的插件树；patch 按 id 定位行，整体替换 config 或插入新行。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#2b5bd7" stroke-width="1.5" /></marker>
  </defs>
  <rect width="840" height="430" fill="#faf9f6" />
  <g font-family="Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#22252a">
    <text x="30" y="35" font-size="16" fill="#5e625f">层按序应用到一个空条目列表上：上面的每一层都能改写下层任意一行</text>

    <rect x="30" y="62" width="470" height="66" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="46" y="90" font-size="17" font-weight="700">1 · Bundles（按 profile 声明的顺序）</text>
    <text x="46" y="114" font-size="14" fill="#5e625f">dsh-base：适配器/工具/持久化/沙箱/审批</text>
    <path d="M265 128V152" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />

    <rect x="30" y="156" width="470" height="56" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="46" y="180" font-size="17" font-weight="700">2 · Profile 的 cordis.patch.yml</text>
    <text x="46" y="201" font-size="14" fill="#5e625f">这个命名组合自己的补丁</text>
    <path d="M265 212V236" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />

    <rect x="30" y="240" width="470" height="56" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="46" y="264" font-size="17" font-weight="700">3 · Home 层 cordis.patch.yml</text>
    <text x="46" y="285" font-size="14" fill="#5e625f">用户在 Harness home 的全局补丁</text>
    <path d="M265 296V320" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />

    <rect x="30" y="324" width="470" height="56" rx="3" fill="#fff" stroke="#2b5bd7" stroke-width="1.5" />
    <text x="46" y="348" font-size="17" font-weight="700">4 · --patch 覆盖层</text>
    <text x="46" y="369" font-size="14" fill="#5e625f">命令行临时叠加，最后应用</text>

    <path d="M500 220H556" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="560" y="160" width="250" height="120" rx="3" fill="#fff" stroke="#2b5bd7" stroke-width="1.5" />
    <text x="576" y="190" font-size="19" font-weight="700">启动时组合的插件树</text>
    <text x="576" y="216" font-size="15">dsh --dump-config 可打印</text>
    <text x="576" y="240" font-size="15">任意一行都可被 patch 替换</text>
    <text x="576" y="264" font-size="14" fill="#5e625f">运行中的 dsh 就是这棵树</text>

    <text x="560" y="320" font-size="14" fill="#40587f">patch 按 id 定位一行：</text>
    <text x="560" y="342" font-size="14" fill="#40587f">整体替换其 config，或插入新行</text>

    <text x="30" y="412" font-size="14" fill="#5e625f">例外：sdk-minimal 不叠 dsh-base——一个 bundle 拥有完整显式插件树，是刻意的例外。</text>
  </g>
</svg>