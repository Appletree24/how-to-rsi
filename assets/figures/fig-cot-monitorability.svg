<svg xmlns="http://www.w3.org/2000/svg" width="840" height="460" viewBox="0 0 840 460" role="img" aria-labelledby="title desc">
  <title id="title">可监控性的信号链与两个断点</title>
  <desc id="desc">监控器从 agent 潜在状态外化出的 CoT 里预测行为性质。信息没写进 CoT 是 faithfulness 失败，写进了但读不懂是 legibility 失败；直接对 CoT 施加优化压力会让监控失效。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#2b5bd7" stroke-width="1.5" /></marker>
  </defs>
  <rect width="840" height="460" fill="#faf9f6" />
  <g font-family="Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#22252a">
    <text x="30" y="35" font-size="16" fill="#5e625f">可监控性 = 监控器能否从 latent 预测行为性质（Guan et al., 2512.18311）</text>

    <rect x="30" y="70" width="160" height="84" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="46" y="99" font-size="16" font-weight="700">agent 潜在状态</text>
    <text x="46" y="125" font-size="14" fill="#5e625f">latent：未言明</text>
    <text x="46" y="146" font-size="14" fill="#5e625f">的内部计算</text>

    <path d="M190 112H228" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <text x="196" y="100" font-size="14" fill="#5e625f">外化</text>

    <rect x="230" y="70" width="160" height="84" rx="3" fill="#fff" stroke="#2b5bd7" stroke-width="1.5" />
    <text x="246" y="99" font-size="16" font-weight="700">CoT 推理文本</text>
    <text x="246" y="125" font-size="14" fill="#5e625f">预谋·目标漂移</text>
    <text x="246" y="146" font-size="14" fill="#5e625f">常先写在这里</text>

    <path d="M390 112H428" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <text x="396" y="100" font-size="14" fill="#5e625f">读取</text>

    <rect x="430" y="70" width="160" height="84" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="446" y="99" font-size="16" font-weight="700">监控器</text>
    <text x="446" y="125" font-size="14" fill="#5e625f">语义级判定，</text>
    <text x="446" y="146" font-size="14" fill="#5e625f">不能靠 grep</text>

    <path d="M590 112H628" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <text x="596" y="100" font-size="14" fill="#5e625f">预测</text>

    <rect x="630" y="70" width="180" height="84" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="646" y="99" font-size="16" font-weight="700">行为性质判定</text>
    <text x="646" y="125" font-size="14" fill="#5e625f">用了干预吗·记了</text>
    <text x="646" y="146" font-size="14" fill="#5e625f">异常吗·在藏什么</text>

    <path d="M209 112V180" fill="none" stroke="#5e625f" stroke-width="1.6" stroke-dasharray="4 4" />
    <rect x="60" y="184" width="300" height="78" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="76" y="211" font-size="15" font-weight="700">断点① faithfulness 失败</text>
    <text x="76" y="236" font-size="14" fill="#5e625f">信息没写进 CoT：推理不完整、有隐藏步骤</text>

    <path d="M409 112V180" fill="none" stroke="#5e625f" stroke-width="1.6" stroke-dasharray="4 4" />
    <rect x="400" y="184" width="330" height="78" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="416" y="211" font-size="15" font-weight="700">断点② legibility 失败</text>
    <text x="416" y="236" font-size="14" fill="#5e625f">读不懂：编码、术语漂移</text>

    <rect x="60" y="290" width="670" height="58" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5" />
    <text x="76" y="314" font-size="15" fill="#40587f">信号强度实测：CoT + 行为轨迹 ＞ 只看 CoT ＞ 只看行为——CoT 给意图，轨迹给佐证</text>
    <text x="76" y="338" font-size="15" fill="#40587f">完全 faithful 不是必要条件：共享常识的监控器能跟上省略的推理步骤</text>

    <path d="M395 348V386" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="60" y="390" width="670" height="52" rx="3" fill="#fff" stroke="#2b5bd7" stroke-width="1.5" />
    <text x="76" y="421" font-size="15" font-weight="700">成立前提：不对 CoT 施加优化压力——被监控者一旦学会写"看起来诚实的推理"，监控即失效</text>
  </g>
</svg>