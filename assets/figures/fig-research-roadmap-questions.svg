<svg xmlns="http://www.w3.org/2000/svg" width="840" height="500" viewBox="0 0 840 500" role="img" aria-labelledby="title desc">
  <title id="title">三个研究问题：比较什么，答案落到哪</title>
  <desc id="desc">记忆迁移实验用真记忆、打乱记忆、无记忆三组测跨仓库任务表现；谱系选择实验用随机、贪心、谱系三组父代选择测终选效用；评分器实验让 judge A、独立 B、外部断言与盲审看同一批冻结产物。三者共用 RepoOps runner 与账本，结论分别指向执行侧、搜索组织与评分证据。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#2b5bd7" stroke-width="1.5"/></marker>
  </defs>
  <rect width="840" height="500" fill="#faf9f6"/>
  <g font-family="Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#22252a">
    <text x="30" y="35" font-size="16" fill="#5e625f">三份未运行的实验设计：比较对象不同，回答的问题也不同</text>

    <rect x="30" y="58" width="250" height="240" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5"/>
    <text x="48" y="83" font-size="15" fill="#40587f">Q1 · 记忆迁移</text>
    <text x="48" y="108" font-size="14">同一干净快照三组运行：</text>
    <rect x="56" y="120" width="196" height="42" rx="3" fill="#fff" stroke="#bfc3c9"/>
    <text x="72" y="146" font-size="14">真记忆（冻结检索器）</text>
    <rect x="56" y="170" width="196" height="42" rx="3" fill="#fff" stroke="#bfc3c9"/>
    <text x="72" y="196" font-size="14">打乱记忆（同格式置换）</text>
    <rect x="56" y="220" width="196" height="42" rx="3" fill="#fff" stroke="#bfc3c9"/>
    <text x="72" y="246" font-size="14">无记忆（原始基线）</text>
    <text x="48" y="286" font-size="13" fill="#40587f">测：新仓库上的任务表现</text>

    <rect x="295" y="58" width="250" height="240" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5"/>
    <text x="313" y="83" font-size="15" fill="#40587f">Q2 · 谱系选择</text>
    <text x="313" y="108" font-size="14">同根同预算，只换父代选择：</text>
    <rect x="321" y="120" width="196" height="42" rx="3" fill="#fff" stroke="#bfc3c9"/>
    <text x="337" y="146" font-size="14">随机均匀抽取</text>
    <rect x="321" y="170" width="196" height="42" rx="3" fill="#fff" stroke="#bfc3c9"/>
    <text x="337" y="196" font-size="14">贪心最高分</text>
    <rect x="321" y="220" width="196" height="42" rx="3" fill="#fff" stroke="#bfc3c9"/>
    <text x="337" y="246" font-size="14">谱系权重公式</text>
    <text x="313" y="286" font-size="13" fill="#40587f">测：独立确认任务上的终选效用</text>

    <rect x="560" y="58" width="250" height="240" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5"/>
    <text x="578" y="83" font-size="15" fill="#40587f">Q3 · 评分器过拟合</text>
    <text x="578" y="108" font-size="14">同一批冻结产物，四种评法：</text>
    <rect x="586" y="120" width="198" height="42" rx="3" fill="#fff" stroke="#bfc3c9"/>
    <text x="602" y="146" font-size="14">judge A（搜索用过）</text>
    <rect x="586" y="170" width="198" height="42" rx="3" fill="#fff" stroke="#bfc3c9"/>
    <text x="602" y="196" font-size="14">独立 judge B + 盲审</text>
    <rect x="586" y="220" width="198" height="42" rx="3" fill="#fff" stroke="#bfc3c9"/>
    <text x="602" y="246" font-size="14">外部可执行断言</text>
    <text x="578" y="286" font-size="13" fill="#40587f">看：各量表上基线→候选的变化</text>

    <rect x="30" y="330" width="780" height="66" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5"/>
    <text x="48" y="355" font-size="15" fill="#40587f">共用底座：RepoOps Lab 的 runner、逐题轨迹与成本账本</text>
    <text x="48" y="378" font-size="14">统计口径见 R3；评分与权限边界见 R4；R1 的反事实：冻结改进过程本身会怎样</text>
    <path d="M155 298V328" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M420 298V328" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M685 298V328" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="30" y="440" font-size="15" fill="#40587f">共同歧义：执行侧收益 ≠ 改进器变强</text>
    <text x="30" y="468" font-size="14" fill="#5e625f">只有经验回流改变了修改器下一轮提议，才有改进过程变化可测；任务阶段收益不能直接替代 R1 的反事实回答。</text>
  </g>
</svg>
