<svg xmlns="http://www.w3.org/2000/svg" width="840" height="480" viewBox="0 0 840 480" role="img" aria-labelledby="title desc">
  <title id="title">自改评测管线的三段数据流</title>
  <desc id="desc">Phase1 冻结任务与版本协议，开发/选择/确认数据分开；Phase2 基线与候选从干净环境运行，外部 verifier 判分落账；Phase3 配对比较裁决 keep/reject/inconclusive，通过后提升部署，候选档案与发布指针分离。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#2b5bd7" stroke-width="1.5" /></marker>
  </defs>
  <rect width="840" height="480" fill="#faf9f6" />
  <g font-family="Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#22252a">
    <text x="30" y="35" font-size="16" fill="#5e625f">协议 → 证据 → 裁决：候选全程碰不到任务集与成绩库，裁决后才谈发布</text>

    <rect x="30" y="56" width="240" height="130" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5" />
    <text x="46" y="80" font-size="15" fill="#40587f">Phase 1 · 任务与版本协议</text>
    <text x="46" y="106" font-size="14">冻结输入/快照/断言/成本上限</text>
    <text x="46" y="128" font-size="14">开发 · 选择 · 确认数据分开</text>
    <text x="46" y="150" font-size="14">define_version(change) → 候选</text>
    <text x="46" y="172" font-size="14" fill="#5e625f">任务集只读挂载</text>

    <rect x="300" y="56" width="250" height="130" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5" />
    <text x="316" y="80" font-size="15" fill="#40587f">Phase 2 · 运行证据</text>
    <text x="316" y="106" font-size="14">基线与候选各自干净环境跑</text>
    <text x="316" y="128" font-size="14">verifier 在候选权限外判分</text>
    <text x="316" y="150" font-size="14">每 trial 记 run_id/成本/结果</text>
    <text x="316" y="172" font-size="14" fill="#5e625f">packageId ≠ 隔离机制</text>
    <path d="M270 121H298" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />

    <rect x="580" y="56" width="230" height="130" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5" />
    <text x="596" y="80" font-size="15" fill="#40587f">Phase 3 · 裁决与发布</text>
    <text x="596" y="106" font-size="14">compare_paired_trials</text>
    <text x="596" y="128" font-size="14">keep / reject / inconclusive</text>
    <text x="596" y="150" font-size="14">过统计+成本+约束门才提升</text>
    <text x="596" y="172" font-size="14" fill="#5e625f">回退另查外部副作用</text>
    <path d="M550 121H578" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />

    <path d="M695 186V228" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="580" y="230" width="230" height="86" rx="3" fill="#fff" stroke="#2b5bd7" stroke-width="1.5" />
    <text x="596" y="259" font-size="16" font-weight="700">verdict == keep ?</text>
    <text x="596" y="283" font-size="14">且 release_policy 允许</text>
    <text x="596" y="305" font-size="14" fill="#5e625f">证据不足 → 保留基线并报告</text>

    <rect x="300" y="230" width="250" height="86" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="316" y="259" font-size="16" font-weight="700">deployment.promote</text>
    <text x="316" y="283" font-size="14">通过 → 提升候选版本</text>
    <text x="316" y="305" font-size="14" fill="#5e625f">否则 keep_current</text>
    <path d="M580 273H552" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />

    <rect x="30" y="230" width="240" height="86" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="46" y="259" font-size="16" font-weight="700">探索档案 archive</text>
    <text x="46" y="283" font-size="14">append 候选+父代+结果+裁决</text>
    <text x="46" y="305" font-size="14" fill="#5e625f">弱候选可留档 ≠ 可发布</text>
    <path d="M300 273H272" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />

    <text x="30" y="352" font-size="15" fill="#40587f">管线要拦下的四类造假</text>
    <rect x="30" y="366" width="186" height="66" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="46" y="392" font-size="14">缺失失败 · 重复成功</text>
    <text x="46" y="414" font-size="14" fill="#5e625f">trial 落账即显形</text>
    <rect x="228" y="366" width="186" height="66" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="244" y="392" font-size="14">伪造自报分数</text>
    <text x="244" y="414" font-size="14" fill="#5e625f">自述与进程外事实分开</text>
    <rect x="426" y="366" width="186" height="66" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="442" y="392" font-size="14">评分器版本错配</text>
    <text x="442" y="414" font-size="14" fill="#5e625f">版本记录可追</text>
    <rect x="624" y="366" width="186" height="66" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="640" y="392" font-size="14">坏候选先生效</text>
    <text x="640" y="414" font-size="14" fill="#5e625f">确认前不碰真实会话</text>
  </g>
</svg>