<svg xmlns="http://www.w3.org/2000/svg" width="840" height="500" viewBox="0 0 840 500" role="img" aria-labelledby="title desc">
  <title id="title">eval_lab：输入 → 校验 → 比较 → 裁决</title>
  <desc id="desc">输入 JSON 含 80 题、每题 3 次共两组 240 条 trial。validate 先核对完整 task×run 集合，compare 算题内差值与 Hoeffding 界，decide 按违规、成本、回归、提升下界的固定顺序落入五个场景各自的裁决。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#2b5bd7" stroke-width="1.5" /></marker>
  </defs>
  <rect width="840" height="500" fill="#faf9f6" />
  <g font-family="Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#22252a">
    <text x="30" y="35" font-size="16" fill="#5e625f">五份合成输入走同一条管线，在不同分支停下</text>

    <rect x="30" y="60" width="170" height="78" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="46" y="84" font-size="15" font-weight="700">*.input.json</text>
    <text x="46" y="106" font-size="13">80 题 × 3 次</text>
    <text x="46" y="126" font-size="13">两组各 240 条 trial</text>
    <rect x="244" y="60" width="170" height="78" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="260" y="84" font-size="15" font-weight="700">validate()</text>
    <text x="260" y="106" font-size="13">完整 task×run 集合</text>
    <text x="260" y="126" font-size="13">缺行 / 非法字段报错</text>
    <rect x="458" y="60" width="170" height="78" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="474" y="84" font-size="15" font-weight="700">compare()</text>
    <text x="474" y="106" font-size="13">δ=0.6，界 [0.326, 0.874]</text>
    <text x="474" y="126" font-size="12">bootstrap 只描述不裁决</text>
    <rect x="672" y="60" width="138" height="78" rx="3" fill="#fff" stroke="#2b5bd7" stroke-width="1.5" />
    <text x="688" y="84" font-size="15" font-weight="700">decision</text>
    <text x="688" y="106" font-size="13">违规→成本→</text>
    <text x="688" y="126" font-size="13">回归→下界</text>
    <path d="M200 99H242" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M414 99H456" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M628 99H670" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />

    <rect x="30" y="170" width="780" height="56" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5" />
    <text x="48" y="193" font-size="15" fill="#40587f">校验失败 ≠ 候选被拒：缺行 → 退出码 2，比较未开始</text>
    <text x="48" y="215" font-size="14">完整合法的 regression / violation / expensive → 退出码 0，decision = reject</text>

    <text x="30" y="266" font-size="15" fill="#40587f">五份输入（均 80 题 × 3 次）的默认裁决</text>
    <rect x="58" y="284" width="140" height="60" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="74" y="308" font-size="15" font-weight="700">improvement</text>
    <text x="74" y="330" font-size="13">20%→80% → keep</text>
    <rect x="214" y="284" width="140" height="60" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="230" y="308" font-size="15" font-weight="700">tie</text>
    <text x="230" y="330" font-size="13">0 → inconclusive</text>
    <rect x="370" y="284" width="140" height="60" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="386" y="308" font-size="15" font-weight="700">regression</text>
    <text x="386" y="330" font-size="13">−0.6 → reject</text>
    <rect x="526" y="284" width="140" height="60" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="542" y="308" font-size="15" font-weight="700">violation</text>
    <text x="542" y="330" font-size="13">严重违规 → reject</text>
    <rect x="682" y="284" width="128" height="60" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="698" y="308" font-size="15" font-weight="700">expensive</text>
    <text x="688" y="330" font-size="13">480&gt;300 → reject</text>

    <text x="30" y="392" font-size="15" fill="#40587f">边界：程序只认输入字段</text>
    <text x="30" y="420" font-size="14">candidate_frozen、模型/环境标识只是输入者的承诺；哈希标识内容，不认证观测来源</text>

    <text x="30" y="472" font-size="15" fill="#5e625f">裁决示意：reason 只报首个命中分支；inconclusive 保留基线，不构成等效证明。</text>
  </g>
</svg>