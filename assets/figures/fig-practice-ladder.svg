<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="840" height="520" viewBox="0 0 840 520" role="img" aria-labelledby="title desc">
  <ns0:title id="title">五关的产物接力</ns0:title>
  <ns0:desc id="desc">五个插件练习按依赖排成阶梯：01 的组合清单供 02 定位注册层，02 的 pluginId 经验供 03 写持久日志，03 的日志 schema 供 04 关联评分，04 的评估门供 05 验证策略替换；勾选进度落 store.done。</ns0:desc>
  <ns0:defs>
    <ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M1 1 9 5 1 9" fill="none" stroke="#2b5bd7" stroke-width="1.5" /></ns0:marker>
  </ns0:defs>
  <ns0:rect width="840" height="520" fill="#faf9f6" />
  <ns0:g font-family="Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#22252a">
    <ns0:text x="30" y="35" font-size="16" fill="#5e625f">每关留下的产物是下一关的输入；编号是练习顺序，不是 RSI 能力等级</ns0:text>

    <ns0:rect x="50" y="340" width="132" height="88" rx="3" fill="#fff" stroke="#bfc3c9" />
    <ns0:text x="64" y="366" font-size="15" font-weight="700">01 · 读图</ns0:text>
    <ns0:text x="64" y="390" font-size="13">配置 vs 实际挂载</ns0:text>
    <ns0:text x="64" y="410" font-size="13" fill="#5e625f">产物：组合清单</ns0:text>
    <ns0:rect x="206" y="288" width="132" height="88" rx="3" fill="#fff" stroke="#bfc3c9" />
    <ns0:text x="220" y="314" font-size="15" font-weight="700">02 · 加载插件</ns0:text>
    <ns0:text x="220" y="338" font-size="13">define→run→审批</ns0:text>
    <ns0:text x="220" y="358" font-size="13" fill="#5e625f">产物：pluginId</ns0:text>
    <ns0:rect x="362" y="236" width="132" height="88" rx="3" fill="#fff" stroke="#bfc3c9" />
    <ns0:text x="376" y="262" font-size="15" font-weight="700">03 · 记忆</ns0:text>
    <ns0:text x="376" y="286" font-size="13">自改日志跨会话</ns0:text>
    <ns0:text x="376" y="306" font-size="13" fill="#5e625f">产物：schema</ns0:text>
    <ns0:rect x="518" y="184" width="132" height="88" rx="3" fill="#fff" stroke="#2b5bd7" stroke-width="1.5" />
    <ns0:text x="532" y="210" font-size="15" font-weight="700">04 · 评测</ns0:text>
    <ns0:text x="532" y="234" font-size="13">eval(version)</ns0:text>
    <ns0:text x="526" y="250" font-size="12" fill="#5e625f">产物：</ns0:text>
    <ns0:rect x="674" y="132" width="132" height="88" rx="3" fill="#fff" stroke="#bfc3c9" />
    <ns0:text x="688" y="158" font-size="15" font-weight="700">05 · 替换策略</ns0:text>
    <ns0:text x="688" y="182" font-size="13">策略可替换</ns0:text>
    <ns0:text x="688" y="202" font-size="13" fill="#5e625f">产物：调用记录</ns0:text>

    <ns0:path d="M184 354L202 366" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <ns0:path d="M340 302L358 314" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <ns0:path d="M496 250L514 262" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <ns0:path d="M652 198L670 210" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />

    <ns0:path d="M584 272V386" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <ns0:path d="M740 220V386" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <ns0:rect x="470" y="388" width="340" height="96" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5" />
    <ns0:text x="486" y="414" font-size="14" fill="#40587f">04 的最小 eval → 第25章扩成：</ns0:text>
    <ns0:text x="486" y="436" font-size="14" fill="#40587f">黄金集 · 隔离执行 · 裁决门</ns0:text>
    <ns0:text x="486" y="466" font-size="14" fill="#40587f">05 之后 → 按 R1 共同起点做冻结策略对照</ns0:text>

    <ns0:rect x="56" y="452" width="360" height="56" rx="3" fill="#fff" stroke="#bfc3c9" />
    <ns0:text x="72" y="477" font-size="14">勾选卡片 → store.done 落账</ns0:text>
    <ns0:rect x="72" y="486" width="200" height="10" rx="2" fill="#fff" stroke="#bfc3c9" />
    <ns0:rect x="72" y="486" width="120" height="10" rx="2" fill="#2b5bd7" />
    <ns0:text x="282" y="496" font-size="14" fill="#5e625f">进度：n/5</ns0:text>
  <ns0:text x="526" y="266" font-size="12">{score,failures}</ns0:text></ns0:g>
</ns0:svg>