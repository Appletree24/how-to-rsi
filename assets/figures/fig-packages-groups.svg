<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="840" height="480" viewBox="0 0 840 480" role="img" aria-labelledby="title desc">
  <ns0:title id="title">包版图：288 包 → 54 分组 → 6 个 bucket</ns0:title>
  <ns0:desc id="desc">左侧六个 bucket 按包数排列；右侧放大 fs 分组，展示 Service Definition / Provider / Consumer 三件套队形，以及 dsh-bundle-* 六个可安装组合层。</ns0:desc>
  <ns0:defs>
    <ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M1 1 9 5 1 9" fill="none" stroke="#2b5bd7" stroke-width="1.5" /></ns0:marker>
  </ns0:defs>
  <ns0:rect width="840" height="480" fill="#faf9f6" />
  <ns0:g font-family="Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#22252a">
    <ns0:text x="30" y="35" font-size="16" fill="#5e625f">packages/ 工作区：288 个 @deepseek-ai/dsh-* 包收进 54 个能力分组，分组再归入 6 个 bucket</ns0:text>

    <ns0:rect x="30" y="58" width="440" height="330" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5" />
    <ns0:text x="48" y="84" font-size="15" fill="#40587f">六个 bucket（条形=包数；注 包·组）</ns0:text>

    <ns0:text x="48" y="120" font-size="16" font-weight="700">应用与界面 app</ns0:text>
    <ns0:rect x="205" y="104" width="196" height="20" rx="3" fill="#fff" stroke="#2b5bd7" stroke-width="1.5" />
    <ns0:text x="405" y="120" font-size="13">87·9</ns0:text><ns0:text x="48" y="172" font-size="16" font-weight="700">智能体能力 cap</ns0:text>
    <ns0:rect x="205" y="156" width="151" height="20" rx="3" fill="#fff" stroke="#2b5bd7" stroke-width="1.5" />
    <ns0:text x="362" y="172" font-size="14">67·22</ns0:text><ns0:text x="48" y="224" font-size="16" font-weight="700">核心引擎 core</ns0:text>
    <ns0:rect x="205" y="208" width="119" height="20" rx="3" fill="#fff" stroke="#2b5bd7" stroke-width="1.5" />
    <ns0:text x="330" y="224" font-size="14">53·7</ns0:text><ns0:text x="48" y="276" font-size="16" font-weight="700">执行与环境 exec</ns0:text>
    <ns0:rect x="205" y="260" width="92" height="20" rx="3" fill="#fff" stroke="#2b5bd7" stroke-width="1.5" />
    <ns0:text x="303" y="276" font-size="14">41·12</ns0:text><ns0:text x="48" y="328" font-size="16" font-weight="700">支撑设施 support</ns0:text>
    <ns0:rect x="205" y="312" width="54" height="20" rx="3" fill="#fff" stroke="#2b5bd7" stroke-width="1.5" />
    <ns0:text x="265" y="328" font-size="14">24·3</ns0:text><ns0:text x="48" y="372" font-size="16" font-weight="700">实验性 exp</ns0:text>
    <ns0:rect x="205" y="356" width="36" height="20" rx="3" fill="#fff" stroke="#2b5bd7" stroke-width="1.5" />
    <ns0:text x="247" y="372" font-size="14">16·1</ns0:text><ns0:rect x="500" y="58" width="310" height="248" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5" />
    <ns0:text x="518" y="84" font-size="15" fill="#40587f">分组内部：seam 三件套（fs · 7包）</ns0:text>
    <ns0:rect x="585" y="102" width="140" height="52" rx="3" fill="#fff" stroke="#bfc3c9" />
    <ns0:text x="601" y="125" font-size="16" font-weight="700">fs</ns0:text>
    <ns0:text x="601" y="144" font-size="12">Service Definition</ns0:text>
    <ns0:rect x="512" y="188" width="140" height="52" rx="3" fill="#fff" stroke="#bfc3c9" />
    <ns0:text x="528" y="211" font-size="16" font-weight="700">fs-local</ns0:text>
    <ns0:text x="528" y="230" font-size="14">Provider 实现</ns0:text>
    <ns0:rect x="662" y="188" width="140" height="52" rx="3" fill="#fff" stroke="#bfc3c9" />
    <ns0:text x="672" y="211" font-size="16" font-weight="700">fs-observation</ns0:text><ns0:text x="678" y="252" font-size="14">Consumer 挂门禁</ns0:text>
    <ns0:path d="M600 188V156H640V154" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <ns0:path d="M714 188V156H672" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <ns0:text x="518" y="278" font-size="14" fill="#5e625f">换实现只动 Provider；tool-fs 等 4 包同组</ns0:text>

    <ns0:rect x="500" y="322" width="310" height="66" rx="3" fill="#fff" stroke="#bfc3c9" />
    <ns0:text x="518" y="348" font-size="16" font-weight="700">dsh-bundle-*：6 个可安装组合层</ns0:text>
    <ns0:text x="518" y="372" font-size="14">base·web-app·headless·sdk·acp</ns0:text><ns0:text x="30" y="428" font-size="15" fill="#5e625f">一个包恰好属于一个分组；命名前缀即层次：dsh-* 能力包 / dsh-tool-* 工具 / dsh-bundle-* 组合。</ns0:text>
    <ns0:text x="30" y="456" font-size="15" fill="#5e625f">写新工具先看 tools/ 分组有无同类；换存储先看 session/ 分组的 persistence seam——分组表是"我该住哪"的索引。</ns0:text>
  <ns0:text x="672" y="230" font-size="16" font-weight="700">-policy</ns0:text></ns0:g>
</ns0:svg>