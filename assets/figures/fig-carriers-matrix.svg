<svg xmlns="http://www.w3.org/2000/svg" width="840" height="480" viewBox="0 0 840 480" role="img" aria-labelledby="title desc">
  <title id="title">四种自改载体与六项运行检查</title>
  <desc id="desc">DSH/Cordis、文件型扩展、自建 harness、ACP 的自改通道与改动对象不同。运行检查从版本、观测、权限、预算、重放与恢复六个方面考察系统能力；修改深度本身不能衡量改进效果。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#2b5bd7" stroke-width="1.5"/></marker>
  </defs>
  <rect width="840" height="480" fill="#faf9f6"/>
  <g font-family="Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#22252a">
    <text x="30" y="35" font-size="16" fill="#5e625f">四种载体可参与自改闭环；修改通道不同，评测仍依赖共同条件</text>

    <rect x="30" y="62" width="186" height="96" rx="3" fill="#fff" stroke="#bfc3c9"/>
    <text x="46" y="88" font-size="16" font-weight="700">DSH / Cordis</text>
    <text x="46" y="114" font-size="14">运行时插件组合</text>
    <text x="46" y="140" font-size="14" fill="#5e625f">改工具·服务·事件</text>
    <rect x="225" y="62" width="186" height="96" rx="3" fill="#fff" stroke="#bfc3c9"/>
    <text x="241" y="88" font-size="15" font-weight="700">文件型 agent 扩展</text>
    <text x="241" y="114" font-size="14">提示词·技能·hooks</text>
    <text x="241" y="140" font-size="14" fill="#5e625f">对象由扩展 API 定</text>
    <rect x="420" y="62" width="186" height="96" rx="3" fill="#fff" stroke="#bfc3c9"/>
    <text x="436" y="88" font-size="16" font-weight="700">自建 harness</text>
    <text x="436" y="114" font-size="14">显式定义循环</text>
    <text x="436" y="140" font-size="14" fill="#5e625f">可改模块由实验定</text>
    <rect x="615" y="62" width="186" height="96" rx="3" fill="#fff" stroke="#bfc3c9"/>
    <text x="631" y="88" font-size="16" font-weight="700">ACP</text>
    <text x="631" y="114" font-size="14">client-agent 通信协议</text>
    <text x="631" y="140" font-size="14" fill="#5e625f">不规定自修改算法</text>

    <path d="M120 158V204" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M315 158V204" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M510 158V204" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M705 158V204" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="30" y="206" width="780" height="228" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5"/>
    <text x="48" y="232" font-size="16" fill="#40587f">六项运行检查 · 考察具体系统的能力</text>
    <text x="60" y="264" font-size="15">① 能否固定模型·提示词·代码·依赖·环境的版本？</text>
    <text x="60" y="292" font-size="15">② 能否导出完整 trial——含超时与失败，不靠 agent 自报？</text>
    <text x="60" y="320" font-size="15">③ 候选权限能否与确认数据·评分器·发布权分离？</text>
    <text x="60" y="348" font-size="15">④ 候选生成·评估·真实执行，能否逐次记成本？</text>
    <text x="60" y="376" font-size="15">⑤ 重启后能否恢复同一版本与环境、重放可重复任务？</text>
    <text x="60" y="404" font-size="15">⑥ 回退代码后，残留副作用有无补偿或试运行机制？</text>

    <text x="30" y="462" font-size="15" fill="#5e625f">评测协议独立于载体，适配器连接具体 harness；修改深度本身不能衡量改进效果。</text>
  </g>
</svg>
