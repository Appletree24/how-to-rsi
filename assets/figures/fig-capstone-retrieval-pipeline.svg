<svg xmlns="http://www.w3.org/2000/svg" width="840" height="500" viewBox="0 0 840 500" role="img" aria-labelledby="title desc">
  <title id="title">检索、融合、上下文与记忆的数据流</title>
  <desc id="desc">查询经词法/向量多路排序，RRF 按 1/(c+rank) 融合，重排只处理前 m 条；上下文按证据相关性、文档有效期与 token 预算组装；记忆带 scope 校验并冻结快照。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#2b5bd7" stroke-width="1.5" /></marker>
  </defs>
  <rect width="840" height="500" fill="#faf9f6" />
  <g font-family="Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#22252a">
    <text x="30" y="35" font-size="16" fill="#5e625f">契约：doc_id · revision · chunk_id · score · source，引用映射不可变版本</text>

    <rect x="30" y="70" width="120" height="78" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="46" y="99" font-size="19" font-weight="700">查询</text>
    <text x="46" y="121" font-size="14">错误码 / 路径</text>
    <text x="46" y="140" font-size="14">函数名等</text>
    <path d="M150 109H178" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />

    <rect x="180" y="55" width="180" height="140" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="196" y="82" font-size="17" font-weight="700">排序支路</text>
    <text x="196" y="110" font-size="15">词重合基线（≤5 标题）</text>
    <text x="196" y="134" font-size="15">BM25 升级</text>
    <text x="196" y="158" font-size="15">向量支路（固定</text>
    <text x="196" y="180" font-size="15">embedding + hash</text>
    <path d="M360 125H398" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />

    <rect x="400" y="55" width="180" height="140" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="416" y="82" font-size="17" font-weight="700">RRF 融合</text>
    <text x="416" y="112" font-size="15">每路贡献 1/(c+rank)</text>
    <text x="416" y="140" font-size="15">c 在开发集固定</text>
    <text x="416" y="168" font-size="15">重排只处理前 m 条</text>
    <path d="M580 125H618" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />

    <rect x="620" y="55" width="190" height="140" rx="3" fill="#fff" stroke="#2b5bd7" stroke-width="1.5" />
    <text x="636" y="82" font-size="17" font-weight="700">上下文组装</text>
    <text x="636" y="112" font-size="14">证据相关 + 文档有效期</text>
    <text x="636" y="140" font-size="15">+ token 预算</text>
    <text x="636" y="168" font-size="14">保目标 / 已读 ID / 假设</text>

    <path d="M715 195V228H270V252" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <text x="500" y="218" font-size="14" fill="#40587f">组装好的证据进 Agent</text>

    <rect x="30" y="254" width="480" height="120" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="46" y="283" font-size="19" font-weight="700">Agent（finish → grade）</text>
    <text x="46" y="312" font-size="15">诊断分组：Recall@k（找不到）· MRR（太后）</text>
    <text x="46" y="336" font-size="15">· 证据保留率（截掉）· 答案/引用分评（忽略证据）</text>
    <text x="46" y="360" font-size="14" fill="#5e625f">oracle 证据替换法逐层定位；无答案样本单独报拒答质量</text>

    <rect x="560" y="254" width="250" height="160" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5" />
    <text x="576" y="281" font-size="15" fill="#40587f">记忆 memory.json</text>
    <text x="576" y="308" font-size="14" font-weight="700">{id, claim,</text>
    <text x="576" y="330" font-size="14" font-weight="700">evidence_ids,</text>
    <text x="576" y="352" font-size="14" font-weight="700">scope, revision}</text>
    <text x="576" y="380" font-size="15">读前校验 scope；运行测试时</text>
    <text x="576" y="402" font-size="15">冻结快照，禁回灌确认集</text>
    <path d="M510 334H558" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />

    <text x="30" y="465" font-size="15" fill="#5e625f">版本冲突是核心陷阱：故障记录建议 rollback，revision 2 手册已改 resize_pool；检索必须带版本。</text>
  </g>
</svg>