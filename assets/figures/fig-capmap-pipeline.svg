<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="840" height="500" viewBox="0 0 840 500" role="img" aria-labelledby="title desc">
  <ns0:title id="title">一次自修改实验的可追踪链路</ns0:title>
  <ns0:desc id="desc">候选先冻结为带 parent_id、improver_id 与内容摘要的版本，再进开发运行；一次运行产生候选行为、外部观测、成本三类事实，由 run_id 关联入账。入档与发布是两个决定：开发数据驱动搜索与终选，确认协议只在预定时点比较候选与现任版本。</ns0:desc>
  <ns0:defs>
    <ns0:marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><ns0:path d="M1 1 9 5 1 9" fill="none" stroke="#2b5bd7" stroke-width="1.5" /></ns0:marker>
  </ns0:defs>
  <ns0:rect width="840" height="500" fill="#faf9f6" />
  <ns0:g font-family="Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#22252a">
    <ns0:text x="30" y="35" font-size="16" fill="#5e625f">修改边界先划定：可改字段之外，模型配置、任务集、计账器、评分规则保持不动</ns0:text>

    <ns0:rect x="30" y="60" width="170" height="72" rx="3" fill="#fff" stroke="#bfc3c9" />
    <ns0:text x="46" y="88" font-size="16" font-weight="700">propose()</ns0:text>
    <ns0:text x="46" y="110" font-size="14">parent + improver</ns0:text>
    <ns0:text x="46" y="128" font-size="13" fill="#5e625f">只用开发反馈</ns0:text>
    <ns0:path d="M115 132V150" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <ns0:rect x="30" y="152" width="170" height="132" rx="3" fill="#fff" stroke="#2b5bd7" stroke-width="1.5" />
    <ns0:text x="46" y="178" font-size="16" font-weight="700">freeze() → 版本</ns0:text>
    <ns0:text x="46" y="202" font-size="14">candidate_id</ns0:text>
    <ns0:text x="46" y="224" font-size="14">parent_id　改进起点</ns0:text>
    <ns0:text x="46" y="246" font-size="14">improver_id　谁改的</ns0:text>
    <ns0:text x="46" y="268" font-size="14">artifact_digest</ns0:text>
    <ns0:path d="M200 218H240" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />

    <ns0:rect x="242" y="152" width="150" height="66" rx="3" fill="#fff" stroke="#bfc3c9" />
    <ns0:text x="258" y="178" font-size="16" font-weight="700">开发运行</ns0:text>
    <ns0:text x="258" y="200" font-size="14">fixed_runner 执行</ns0:text>
    <ns0:path d="M317 218V238" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />

    <ns0:rect x="242" y="240" width="290" height="150" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5" />
    <ns0:text x="258" y="264" font-size="15" fill="#40587f">一次运行 = 三类事实（run_id 关联）</ns0:text>
    <ns0:text x="258" y="290" font-size="14">① 候选行为：读写、检索、工具调用</ns0:text>
    <ns0:text x="258" y="314" font-size="14">② 外部观测：断言、退出态、超时</ns0:text>
    <ns0:text x="258" y="338" font-size="14">③ 成本：token、CPU、墙钟、验证费</ns0:text>
    <ns0:text x="258" y="364" font-size="13" fill="#5e625f">超时计入分母，不从平均中消失</ns0:text>
    <ns0:path d="M532 300H560V216" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />

    <ns0:rect x="412" y="152" width="200.0" height="66" rx="3" fill="#fff" stroke="#bfc3c9" />
    <ns0:text x="428" y="178" font-size="16" font-weight="700">ledger</ns0:text>
    <ns0:text x="428" y="200" font-size="14">版本+观测+全成本</ns0:text>

    <ns0:path d="M612 185H620V140H630" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <ns0:path d="M612 185H620V300H630" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />

    <ns0:rect x="632" y="88" width="172.0" height="104" rx="3" fill="#fff" stroke="#bfc3c9" />
    <ns0:text x="648" y="114" font-size="16" font-weight="700">决定一 · 入档</ns0:text>
    <ns0:text x="648" y="138" font-size="14">能启动、接口合规、</ns0:text>
    <ns0:text x="648" y="158" font-size="14">仍能生成候选</ns0:text>
    <ns0:text x="648" y="180" font-size="13" fill="#5e625f">不要求超过发布版本</ns0:text>

    <ns0:rect x="632" y="238" width="172.0" height="140" rx="3" fill="#fff" stroke="#2b5bd7" stroke-width="1.5" />
    <ns0:text x="648" y="264" font-size="16" font-weight="700">决定二 · 发布</ns0:text>
    <ns0:text x="648" y="288" font-size="14">预定终选时点才执行</ns0:text>
    <ns0:text x="648" y="310" font-size="14">confirm(候选, 现任,</ns0:text>
    <ns0:text x="648" y="330" font-size="14">　locked_protocol)</ns0:text>
    <ns0:text x="648" y="352" font-size="14">keep → 替换现任</ns0:text>
    <ns0:text x="648" y="372" font-size="14" fill="#5e625f">inconclusive→保持</ns0:text>

    <ns0:rect x="30" y="416" width="774.0" height="56" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5" />
    <ns0:text x="48" y="440" font-size="15" fill="#40587f">分界线：开发数据筛候选、喂搜索；确认数据只在冻结后检验终选</ns0:text>
    <ns0:text x="48" y="462" font-size="14" fill="#5e625f">每生成一个候选就读确认结果再提修改＝确认集变成搜索反馈，换文件名不能恢复独立性</ns0:text>
  </ns0:g>
</ns0:svg>