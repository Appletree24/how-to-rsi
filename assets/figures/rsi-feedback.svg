<svg xmlns="http://www.w3.org/2000/svg" width="840" height="470" viewBox="0 0 840 470" role="img" aria-labelledby="title desc">
  <title id="title">两层评分：改解题器与改改进器</title>
  <desc id="desc">内层循环用 U 给解析器打分；外层循环用 M 给改进器打分，M 的观测来自改进器产出的解析器得分。I1 在下一轮接管对 S 的修改。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#2b5bd7" stroke-width="1.5" /></marker>
  </defs>
  <rect width="840" height="470" fill="#faf9f6" />
  <g font-family="Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#22252a">
    <text x="30" y="35" font-size="16" fill="#5e625f">同一个 improve 过程：评分对象不同，效用函数也不同</text>

    <rect x="30" y="58" width="360" height="180" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5" />
    <text x="48" y="83" font-size="15" fill="#40587f">内层 · 修改解题器</text>
    <rect x="58" y="102" width="130" height="64" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="74" y="129" font-size="17" font-weight="700">改进器 I</text>
    <text x="74" y="152" font-size="14">提议 + 接受规则</text>
    <rect x="232" y="102" width="130" height="64" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="248" y="129" font-size="17" font-weight="700">解析器 S</text>
    <text x="248" y="152" font-size="14">补丁组合</text>
    <path d="M188 134H230" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="145" y="182" width="130" height="44" rx="3" fill="#fff" stroke="#2b5bd7" stroke-width="1.5" />
    <text x="161" y="209" font-size="16" font-weight="700">U(S)：通过率</text>
    <path d="M297 166V196H277" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />

    <rect x="450" y="58" width="360" height="180" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5" />
    <text x="468" y="83" font-size="15" fill="#40587f">外层 · 修改改进器</text>
    <rect x="478" y="102" width="130" height="64" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="494" y="129" font-size="17" font-weight="700">I₀（冻结）</text>
    <text x="494" y="152" font-size="14">本次调用内不变</text>
    <rect x="652" y="102" width="130" height="64" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="668" y="129" font-size="17" font-weight="700">I 候选</text>
    <text x="668" y="152" font-size="14">补丁顺序变体</text>
    <path d="M608 134H650" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="565" y="182" width="130" height="44" rx="3" fill="#fff" stroke="#2b5bd7" stroke-width="1.5" />
    <text x="581" y="209" font-size="14" font-weight="700">M(I)：S 的 U</text><path d="M717 166V196H697" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />

    <path d="M630 238V300H420V332" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="320" y="334" width="200" height="62" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="336" y="360" font-size="17" font-weight="700">保留的 I₁</text>
    <text x="336" y="383" font-size="14">trim 优先的顺序</text>
    <path d="M320 365H148V240" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <text x="88" y="292" font-size="15" fill="#40587f">下一次改进 S 时接管</text>

    <text x="30" y="440" font-size="15" fill="#5e625f">外层评分一次 = 一次完整内层搜索的成本；M 高不等于 S 在新分布上高。</text>
  </g>
</svg>