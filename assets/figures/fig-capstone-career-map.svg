<svg xmlns="http://www.w3.org/2000/svg" width="840" height="500" viewBox="0 0 840 500" role="img" aria-labelledby="title desc">
  <title id="title">项目证据到岗位方向的映射</title>
  <desc id="desc">各实验产出的证据分别支撑三个岗位方向：P2/P3 的工具循环与检索分析对应应用工程，P4/P6/P7/P9/P10 的评分与配对实验对应评测工程，P5/P8 的租约恢复与迁移对应平台后端；面试中暴露的证据缺口回流为补充实验。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#2b5bd7" stroke-width="1.5"/></marker>
  </defs>
  <rect width="840" height="500" fill="#faf9f6"/>
  <g font-family="Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#22252a">
    <text x="30" y="35" font-size="16" fill="#5e625f">实验产物与岗位能力的对应关系：同一项目在不同方向上提供不同证据</text>

    <text x="30" y="64" font-size="15" font-weight="700" fill="#40587f">项目证据（按实验）</text>
    <rect x="30" y="76" width="270" height="46" rx="3" fill="#fff" stroke="#bfc3c9"/>
    <text x="44" y="95" font-size="14" font-weight="700">P2 受限工具循环</text>
    <text x="44" y="113" font-size="13" fill="#5e625f">完整失败轨迹与状态转换</text>
    <rect x="30" y="130" width="270" height="46" rx="3" fill="#fff" stroke="#bfc3c9"/>
    <text x="44" y="149" font-size="14" font-weight="700">P3 检索证据实验</text>
    <text x="44" y="167" font-size="13" fill="#5e625f">检索消融、丢失证据案例</text>
    <rect x="30" y="184" width="270" height="46" rx="3" fill="#fff" stroke="#bfc3c9"/>
    <text x="44" y="203" font-size="14" font-weight="700">P4/P6 评分可信性</text>
    <text x="44" y="221" font-size="13" fill="#5e625f">mutant 审计、误判矩阵、成本账本</text>
    <rect x="30" y="238" width="270" height="46" rx="3" fill="#fff" stroke="#bfc3c9"/>
    <text x="44" y="257" font-size="14" font-weight="700">P7 固定预算配对实验</text>
    <text x="44" y="275" font-size="13" fill="#5e625f">配对差值、聚类区间、负结果</text>
    <rect x="30" y="292" width="270" height="46" rx="3" fill="#fff" stroke="#bfc3c9"/>
    <text x="44" y="311" font-size="14" font-weight="700">P5 租约与恢复演练</text>
    <text x="44" y="329" font-size="13" fill="#5e625f">迟到提交拒绝、容量与争用报告</text>
    <rect x="30" y="346" width="270" height="46" rx="3" fill="#fff" stroke="#bfc3c9"/>
    <text x="44" y="365" font-size="14" font-weight="700">P8 Harbor 迁移任务</text>
    <text x="44" y="383" font-size="13" fill="#5e625f">框架适配、架构决策记录 ADR</text>
    <rect x="30" y="400" width="270" height="46" rx="3" fill="#fff" stroke="#bfc3c9"/>
    <text x="44" y="419" font-size="14" font-weight="700">P9/P10 搜索与元实验</text>
    <text x="44" y="437" font-size="13" fill="#5e625f">预算账本、三组对照、元收益消融</text>

    <rect x="450" y="76" width="360" height="112" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5"/>
    <text x="468" y="101" font-size="15" font-weight="700" fill="#40587f">Agent / AI 应用工程</text>
    <text x="468" y="126" font-size="14">可演示的工具循环 · 检索错误分析 · 可靠降级</text>
    <text x="468" y="150" font-size="14" fill="#5e625f">材料：一键运行、3 分钟演示、失败兜底说明</text>
    <text x="468" y="172" font-size="14" fill="#5e625f">边界：具体语言与业务以目标 JD 为准</text>

    <rect x="450" y="204" width="360" height="112" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5"/>
    <text x="468" y="229" font-size="15" font-weight="700" fill="#40587f">评测工程 / Research Engineer</text>
    <text x="468" y="254" font-size="14">版本化任务集 · 独立评分 · 配对实验与负结果</text>
    <text x="468" y="278" font-size="14" fill="#5e625f">材料：实验报告、误判矩阵、统计与消融</text>
    <text x="468" y="300" font-size="14" fill="#5e625f">边界：API 包装不涵盖 Python 与统计能力</text>

    <rect x="450" y="332" width="360" height="112" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5"/>
    <text x="468" y="357" font-size="15" font-weight="700" fill="#40587f">AI 基础设施 / 研究平台后端</text>
    <text x="468" y="382" font-size="14">租约与恢复演练 · 容量报告 · 数据一致性说明</text>
    <text x="468" y="406" font-size="14" fill="#5e625f">材料：故障复盘、系统设计图、接口对照</text>
    <text x="468" y="428" font-size="14" fill="#5e625f">边界：个人负载实验不代表生产运行经验</text>

    <path d="M300 99H330V132H448" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M300 153H448" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M300 207H448V250" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M300 261H448V262" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M300 315H448V380" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M300 369H448V390" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M300 423H448V300" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)"/>

    <path d="M630 444V468H340V450" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="346" y="487" font-size="14" fill="#5e625f">面试暴露的证据缺口 → 补充实验；0–2 分自评仅用于查漏</text>
  </g>
</svg>
