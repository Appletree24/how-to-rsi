<svg xmlns="http://www.w3.org/2000/svg" width="840" height="480" viewBox="0 0 840 480" role="img" aria-labelledby="title desc">
  <title id="title">一张工单的数据分工</title>
  <desc id="desc">任务记录按消费者拆成三部分：run_agent 只收 prompt 与 documents；grade 在循环结束后才用 expected_answer、required_citations 与 forbidden_answers。family 决定拆分边界。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#2b5bd7" stroke-width="1.5"/></marker>
  </defs>
  <rect width="840" height="480" fill="#faf9f6"/>
  <g font-family="Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#22252a">
    <text x="30" y="35" font-size="16" fill="#5e625f">同一行记录，三个消费者；进程内参数分离是习惯，不是隔离</text>

    <rect x="30" y="60" width="240" height="300" rx="3" fill="#fff" stroke="#bfc3c9"/>
    <text x="46" y="90" font-size="19" font-weight="700">任务记录</text>
    <text x="46" y="122" font-size="17">id: checkout-0</text>
    <text x="46" y="150" font-size="17">family: checkout</text>
    <text x="46" y="178" font-size="17">split: dev</text>
    <text x="46" y="206" font-size="17">prompt</text>
    <text x="46" y="234" font-size="17">documents[4]</text>
    <text x="46" y="262" font-size="17">expected_answer</text>
    <text x="46" y="290" font-size="17">required_citations</text>
    <text x="46" y="318" font-size="17">forbidden_answers</text>
    <text x="46" y="348" font-size="14" fill="#5e625f">见 tasks.json</text>

    <path d="M270 170H298V132H316" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="278" y="105" font-size="14" fill="#40587f">prompt + documents</text>
    <path d="M270 270H316" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="278" y="250" font-size="14" fill="#40587f">循环结束后才用</text>

    <rect x="318" y="70" width="230" height="120" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5"/>
    <text x="334" y="97" font-size="15" fill="#40587f">Agent 可见</text>
    <text x="334" y="126" font-size="17" font-weight="700">run_agent</text>
    <text x="334" y="154" font-size="16">prompt + documents</text>
    <text x="334" y="178" font-size="16">→ answer · citations</text>

    <rect x="318" y="230" width="230" height="130" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5"/>
    <text x="334" y="257" font-size="15" fill="#40587f">评分器私有</text>
    <text x="334" y="286" font-size="17" font-weight="700">grade(task, result)</text>
    <text x="334" y="314" font-size="16">expected_answer</text>
    <text x="334" y="338" font-size="16">required / forbidden</text>

    <rect x="588" y="120" width="222" height="200" rx="3" fill="#fff" stroke="#bfc3c9"/>
    <text x="604" y="150" font-size="19" font-weight="700">family 拆分规则</text>
    <text x="604" y="182" font-size="16">同 family 的工单必须</text>
    <text x="604" y="206" font-size="16">落在同一 split：</text>
    <text x="604" y="234" font-size="16">checkout 两张不能</text>
    <text x="604" y="258" font-size="16">一张 dev 一张确认</text>
    <text x="604" y="292" font-size="14" fill="#5e625f">dev / test_public</text>
    <path d="M548 130H586V168" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="30" y="445" font-size="15" fill="#5e625f">扩展校验：load_dataset 检查任务 ID、family 跨拆分与证据 ID，错误信息定位到 task_id。</text>
  </g>
</svg>
