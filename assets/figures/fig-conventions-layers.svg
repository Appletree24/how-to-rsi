<svg xmlns="http://www.w3.org/2000/svg" width="840" height="470" viewBox="0 0 840 470" role="img" aria-labelledby="title desc">
  <title id="title">工程约定分层：28 条核心守则 + 7 条防御性模式</title>
  <desc id="desc">核心守则自上而下分四组：架构铁律 10 条决定各层形状，事件与类型 6 条、代码卫生 6 条、流程与协作 6 条依次约束实现与协作；防御性写法模式 7 条由事故复盘沉淀，横切所有层。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#2b5bd7" stroke-width="1.5" /></marker>
  </defs>
  <rect width="840" height="470" fill="#faf9f6" />
  <g font-family="Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#22252a">
    <text x="30" y="35" font-size="16" fill="#5e625f">架构约定确定分层，其他约定约束实现与协作；防御性模式来自事故复盘</text>

    <rect x="30" y="60" width="560" height="84" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5" />
    <text x="48" y="88" font-size="16" font-weight="700" fill="#40587f">架构铁律 · 10 条</text>
    <text x="48" y="114" font-size="15">注册即效果 · seam 是完整三角 · 显式 resolve 取代隐藏默认值</text>
    <text x="48" y="134" font-size="14" fill="#5e625f">决定下面所有层允许的形状</text>

    <rect x="30" y="158" width="560" height="84" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5" />
    <text x="48" y="186" font-size="16" font-weight="700" fill="#40587f">事件与类型 · 6 条</text>
    <text x="48" y="212" font-size="15">事件用声明合并 · waterfall 必须 next() · 模型可见 ⟺ 已记录</text>
    <text x="48" y="232" font-size="14" fill="#5e625f">约束事件契约与类型边界</text>

    <rect x="30" y="256" width="560" height="84" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5" />
    <text x="48" y="284" font-size="16" font-weight="700" fill="#40587f">代码卫生 · 6 条</text>
    <text x="48" y="310" font-size="15">空 catch 留名 · 注释只讲契约 · FIXME &gt; TODO &gt; XXX</text>
    <text x="48" y="330" font-size="14" fill="#5e625f">约束单文件内的写法</text>

    <rect x="30" y="354" width="560" height="84" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5" />
    <text x="48" y="382" font-size="16" font-weight="700" fill="#40587f">流程与协作 · 6 条</text>
    <text x="48" y="408" font-size="15">非平凡改动必附 Agent Note · 慢进快退 · 文档随代码同行</text>
    <text x="48" y="428" font-size="14" fill="#5e625f">约束 PR 与协作行为</text>

    <rect x="630" y="60" width="180" height="378" rx="3" fill="#fff" stroke="#2b5bd7" stroke-width="1.5" />
    <text x="648" y="90" font-size="16" font-weight="700">防御性写法</text>
    <text x="648" y="112" font-size="16" font-weight="700">模式 · 7 条</text>
    <text x="648" y="148" font-size="14">正交结果独立上报</text>
    <text x="648" y="172" font-size="14">Dispose 要抵达静止</text>
    <text x="648" y="196" font-size="14">围堵监听器异常</text>
    <text x="648" y="220" font-size="14">派生环境先清洗密钥</text>
    <text x="648" y="244" font-size="14">lstat 再 unlink</text>
    <text x="648" y="278" font-size="14" fill="#5e625f">横切所有层：</text>
    <text x="648" y="300" font-size="14" fill="#5e625f">每条都来自</text>
    <text x="648" y="322" font-size="14" fill="#5e625f">docs/postmortem/ 的</text>
    <text x="648" y="344" font-size="14" fill="#5e625f">真实事故</text>
    <path d="M630 120H592" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M630 249H592" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M630 380H592" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />

    <text x="30" y="462" font-size="15" fill="#5e625f">工程约定示意：分层决定改动归属，各层约定进一步约束生命周期与副作用责任。</text>
  </g>
</svg>