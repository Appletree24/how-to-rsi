<svg xmlns="http://www.w3.org/2000/svg" width="840" height="500" viewBox="0 0 840 500" role="img" aria-labelledby="title desc">
  <title id="title">自我改进的五种对象：什么变了，什么没动</title>
  <desc id="desc">按变化对象给方法分派：答案留在本题、记忆与技能改变下次输入、权重写入参数、程序与搜索器保留候选、环境与解法共同演化；每行标注固定不动的部分与定位收益的对照。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#2b5bd7" stroke-width="1.5"/></marker>
  </defs>
  <rect width="840" height="500" fill="#faf9f6"/>
  <g font-family="Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#22252a">
    <text x="30" y="35" font-size="16" fill="#5e625f">分数上升看起来相似，留下来的东西不同——按变化对象分派路线</text>

    <rect x="30" y="62" width="780" height="72" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5"/>
    <text x="48" y="87" font-size="15" fill="#40587f">答案 · Self-Refine</text>
    <text x="48" y="113" font-size="14">改的是本题产物；对照：同预算多采样 / 保留重写但去反馈</text>

    <rect x="30" y="146" width="780" height="72" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5"/>
    <text x="48" y="171" font-size="15" fill="#40587f">记忆与技能 · Reflexion、Voyager</text>
    <text x="48" y="197" font-size="14">改的是下次作答的输入；对照：清空记忆 / 打乱条目 / 跨任务测试</text>

    <rect x="30" y="230" width="780" height="72" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5"/>
    <text x="48" y="255" font-size="15" fill="#40587f">权重 · STaR、MAML</text>
    <text x="48" y="281" font-size="14">改的是参数或初始化起点；生成—筛选—训练与元优化流程可始终固定</text>

    <rect x="30" y="314" width="780" height="72" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5"/>
    <text x="48" y="339" font-size="15" fill="#40587f">程序与搜索器 · FunSearch、AutoML-Zero、ADAS、STOP/DGM/HGM</text>
    <text x="48" y="365" font-size="14">候选是程序或 agent 设计；生成、筛选的外部搜索器可以不变</text>

    <rect x="30" y="398" width="780" height="72" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5"/>
    <text x="48" y="423" font-size="15" fill="#40587f">环境 · POET</text>
    <text x="48" y="449" font-size="14">题目与解法共同演化；固定审计任务才能跨轮比较分数</text>

    <text x="30" y="488" font-size="15" fill="#5e625f">路线可以组合：区分变化对象，是为了效果出现时知道该检查哪一部分，而不是贴唯一标签。</text>
  </g>
</svg>
