<svg xmlns="http://www.w3.org/2000/svg" width="840" height="480" viewBox="0 0 840 480" role="img" aria-labelledby="title desc">
  <title id="title">来源分层与核对范围：每条结论回到哪类出处</title>
  <desc id="desc">引用标识指向版本化来源：论文按 arXiv 版本读指定章节与附录，摘要级条目只做方法定位，官方文档与源码核对对应文件，岗位与面经自述只支撑实战主题。版本与 checked_at 存于来源登记文件。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#2b5bd7" stroke-width="1.5"/></marker>
  </defs>
  <rect width="840" height="480" fill="#faf9f6"/>
  <g font-family="Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#22252a">
    <text x="30" y="35" font-size="16" fill="#5e625f">正文标识 [stop] [dgm] 等 → 同一登记文件里的版本与阅读范围</text>

    <rect x="30" y="60" width="150" height="56" rx="3" fill="#fff" stroke="#bfc3c9"/>
    <text x="46" y="83" font-size="15" font-weight="700">正文引用标识</text>
    <text x="46" y="104" font-size="13">[stop] [dgm] …</text>
    <path d="M180 88H212" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="216" y="58" width="594" height="60" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5"/>
    <text x="234" y="82" font-size="15" fill="#40587f">论文 · 全文核对：按 arXiv 版本读指定章节附录</text>
    <text x="234" y="104" font-size="13">STOP v3 §3–4 · DGM v3 §3、C.2–C.4、E.1 · HGM v3 §2–3.3、附录 D</text>
    <rect x="216" y="130" width="594" height="60" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5"/>
    <text x="234" y="154" font-size="15" fill="#40587f">论文 · 摘要/元数据：13 条来源仅用于方法定位，不转述实验</text>
    <text x="234" y="176" font-size="13">Self-Refine、Reflexion、Voyager、STaR、MAML、POET 等 → 供 R5 分派</text>
    <rect x="216" y="202" width="594" height="60" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5"/>
    <text x="234" y="226" font-size="15" fill="#40587f">官方文档 / 源码：核对该文件该 commit 的表述</text>
    <text x="234" y="248" font-size="13">DSH SAFETY.md "未经安全审计" · labs 程序与 README → 支撑 R4、R6</text>
    <rect x="216" y="274" width="594" height="60" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5"/>
    <text x="234" y="298" font-size="15" fill="#40587f">自述 / 面经：个人整理，非官方题库</text>
    <text x="234" y="320" font-size="13">岗位描述与公开面经 → 只支撑实战章主题与练习设计</text>

    <rect x="30" y="368" width="230" height="56" rx="3" fill="#fff" stroke="#bfc3c9"/>
    <text x="46" y="391" font-size="15" font-weight="700">来源报告</text>
    <text x="46" y="413" font-size="13">作者报告的该设置结果</text>
    <rect x="304" y="368" width="230" height="56" rx="3" fill="#fff" stroke="#bfc3c9"/>
    <text x="320" y="391" font-size="15" font-weight="700">公式算例</text>
    <text x="320" y="413" font-size="13">手算解释公式，非实测</text>
    <rect x="578" y="368" width="230" height="56" rx="3" fill="#fff" stroke="#bfc3c9"/>
    <text x="594" y="391" font-size="15" font-weight="700">本仓库运行</text>
    <text x="594" y="413" font-size="13">可下载代码与命令</text>

    <text x="30" y="462" font-size="15" fill="#5e625f">版本号与 commit 定位讨论文本；逐条核对日期在 sources.json 的 checked_at 字段。</text>
  </g>
</svg>
