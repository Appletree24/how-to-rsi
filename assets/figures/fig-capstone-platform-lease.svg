<svg xmlns="http://www.w3.org/2000/svg" width="840" height="500" viewBox="0 0 840 500" role="img" aria-labelledby="title desc">
  <title id="title">租约与 fencing：迟到提交被拒绝</title>
  <desc id="desc">Worker 1 领取任务（fencing_token=7）后崩溃；租约过期，Worker 2 以 token=8 领取并完成。Worker 1 迟到的旧 token 提交因条件更新命中 0 行被拒绝，仅入诊断日志。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#2b5bd7" stroke-width="1.5" /></marker>
  </defs>
  <rect width="840" height="500" fill="#faf9f6" />
  <g font-family="Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#22252a">
    <text x="30" y="35" font-size="16" fill="#5e625f">同一 trial 被领取两次：租约决定谁能运行，fencing token 决定谁能写回（时间以数据库为准）</text>

    <text x="50" y="72" font-size="16" font-weight="700" fill="#40587f">Worker 1（旧 attempt）</text>
    <text x="368" y="72" font-size="16" font-weight="700" fill="#40587f">控制面 / DB</text>
    <text x="618" y="72" font-size="16" font-weight="700" fill="#40587f">Worker 2（新 attempt）</text>
    <line x1="130" y1="88" x2="130" y2="455" stroke="#8c9cbd" stroke-dasharray="4 4" />
    <line x1="430" y1="88" x2="430" y2="455" stroke="#8c9cbd" stroke-dasharray="4 4" />
    <line x1="700" y1="88" x2="700" y2="455" stroke="#8c9cbd" stroke-dasharray="4 4" />

    <text x="158" y="108" font-size="15">1　claim → attempt_id · fencing_token=7 · lease_until</text>
    <path d="M150 122H408" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />

    <rect x="40" y="150" width="250.0" height="48" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="56" y="179" font-size="15" font-weight="700">2　崩溃</text>

    <rect x="330" y="216" width="270.0" height="56" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="346" y="240" font-size="15" font-weight="700">3　lease_until 过期</text>
    <text x="346" y="261" font-size="14">trial 回 queued</text>

    <text x="458" y="302" font-size="15">4　claim → fencing_token=8（递增）</text>
    <path d="M690 316H452" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />

    <text x="458" y="352" font-size="15">5　complete(token=8)</text>
    <text x="458" y="372" font-size="14" fill="#5e625f">state∧token∧lease 命中 → 更新 1 行 → succeeded</text>
    <path d="M690 384H452" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />

    <text x="158" y="412" font-size="15">6　迟到的 complete(token=7)</text>
    <text x="158" y="432" font-size="14" fill="#5e625f">条件更新命中 0 行 → 拒绝覆盖，写入诊断日志</text>
    <path d="M150 444H408" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />

    <text x="30" y="482" font-size="15" fill="#5e625f">租约与 fencing 只挡写回，挡不住已发出的外部副作用；同 Idempotency-Key 重复建实验各计一次。</text>
  </g>
</svg>