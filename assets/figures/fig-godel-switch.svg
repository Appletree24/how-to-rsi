<svg xmlns="http://www.w3.org/2000/svg" width="840" height="500" viewBox="0 0 840 500" role="img" aria-labelledby="title desc">
  <title id="title">Gödel Machine 的一轮自改</title>
  <desc id="desc">证明搜索器在 p 内调度证明技术：get-axiom 与 apply-rule 向 proof 追加定理，set-switchprog 设定候选重写，check 检查目标定理。目标定理比较现在执行 switchprog 与 p 原样继续两个分支；证出后 check 置 switchbit 执行 switchprog 重写 p，未证出则 p 原样继续。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#2b5bd7" stroke-width="1.5" /></marker>
  </defs>
  <rect width="840" height="500" fill="#faf9f6" />
  <g font-family="Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" fill="#22252a">
    <text x="30" y="35" font-size="16" fill="#5e625f">先证明，再修改：目标定理证出之前，p 原样运行</text>

    <rect x="30" y="56" width="300" height="372" rx="3" fill="#f1f4fb" stroke="#8c9cbd" stroke-dasharray="5 5" />
    <text x="48" y="82" font-size="15" fill="#40587f">p(t) · 可改软件（两部分都可能被重写）</text>
    <rect x="50" y="96" width="260" height="56" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="66" y="120" font-size="17" font-weight="700">求解器 e(1)</text>
    <text x="66" y="142" font-size="14">与环境交互，通常并非最优</text>
    <rect x="50" y="170" width="260" height="76" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="66" y="194" font-size="17" font-weight="700">证明搜索器 BIOPS</text>
    <text x="66" y="216" font-size="14">按先验权重给各证明技术分配份额</text>
    <text x="66" y="236" font-size="14">自身也在 p 内，可被重写</text>
    <path d="M180 246V264" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="50" y="266" width="260" height="130" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="66" y="292" font-size="15">get-axiom(n)　追加公理</text>
    <text x="66" y="316" font-size="15">apply-rule(k,m,n)　推理</text>
    <text x="66" y="340" font-size="15">set-switchprog　设候选重写</text>
    <text x="66" y="364" font-size="15" font-weight="700">check()　末条 = 目标定理？</text>
    <text x="66" y="388" font-size="13" fill="#5e625f">定理只能经专用指令追加</text>

    <rect x="390" y="170" width="230" height="160" rx="3" fill="#fff" stroke="#2b5bd7" stroke-width="1.5" />
    <text x="406" y="196" font-size="17" font-weight="700">目标定理（式 2）</text>
    <text x="406" y="222" font-size="15">u[ s⊕(switchbit='1'), Env ]</text>
    <text x="426" y="242" font-size="13" fill="#5e625f">现在执行 switchprog</text>
    <text x="406" y="266" font-size="17" font-weight="700" fill="#2b5bd7">&gt;</text>
    <text x="406" y="290" font-size="15">u[ s⊕(switchbit='0'), Env ]</text>
    <text x="426" y="310" font-size="13" fill="#5e625f">p 原样运行（隐含未来候选）</text>

    <path d="M310 364H352V250H388" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />

    <rect x="660" y="170" width="150" height="76" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="676" y="196" font-size="16" font-weight="700">证出</text>
    <text x="676" y="218" font-size="14">check() 置</text>
    <text x="676" y="238" font-size="14">switchbit='1'</text>
    <path d="M620 240H658" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <path d="M735 246V278" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="660" y="280" width="150" height="100" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="676" y="306" font-size="16" font-weight="700">重写 p</text>
    <text x="676" y="330" font-size="14">求解器、搜索器</text>
    <text x="676" y="350" font-size="14">或两者一起</text>
    <text x="676" y="372" font-size="13" fill="#5e625f">硬件保留变量除外</text>
    <path d="M735 380V456H180V426" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <text x="200" y="448" font-size="14" fill="#40587f">重写后的 p 进入下一轮</text>

    <path d="M505 330V354" fill="none" stroke="#2b5bd7" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="390" y="356" width="230" height="84" rx="3" fill="#fff" stroke="#bfc3c9" />
    <text x="406" y="382" font-size="16" font-weight="700">本轮未证出</text>
    <text x="406" y="404" font-size="14">p 原样继续，证明搜索继续</text>
    <text x="406" y="426" font-size="14" fill="#2b5bd7">未找到证明 ≠ 已证无益</text>

    <text x="30" y="486" font-size="15" fill="#5e625f">效用 u = 剩余生存期的期望累计回报；check() 与搜索消耗的周期也计入其中。</text>
  </g>
</svg>